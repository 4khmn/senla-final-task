spring.application.name=senla-final-task

spring.datasource.url=jdbc:postgresql://localhost:5432/velo_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=100MB

logging.file.name=logs/app.log

logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.max-history=7
spring.output.ansi.enabled=always


app.init.admin.username=main-admin
app.init.admin.password=Admin123!
app.init.admin.email=admin@admin.com

